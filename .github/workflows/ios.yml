name: iOS CI

on:
  push:
    branches:
      - master
      - main
      - 'codex/**'
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-build:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run Swift package tests
        shell: bash
        run: |
          set -o pipefail
          swift test --verbose 2>&1 | tee swift-test.log
          test_status=${PIPESTATUS[0]}
          {
            echo '## swift test tail'
            echo '```text'
            tail -n 200 swift-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"

      - name: Upload Swift test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-log
          path: swift-test.log
          if-no-files-found: warn

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project Armyra.xcodeproj \
            -scheme ArmyraApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Armyra-simulator-app
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/Armyra.app
          if-no-files-found: error